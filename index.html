:root{
  --green:#00857C;      /* 하나그린 근사값 - 브랜드 가이드 확정 필요 */
  --green-deep:#006A63;
  --green-wash:#E6F2F0;
  --red:#D9264F;        /* 하나레드 근사값 - 코드 강조에만 사용 */
  --ink:#16302E;
  --sub:#5C706E;
  --line:#CFDCDA;
  --paper:#F2F6F5;
  --white:#fff;
}
*{box-sizing:border-box;margin:0}
button,select,option{font-family:inherit}
html{-webkit-text-size-adjust:100%}
body{word-break:keep-all;font-family:"Hana2",sans-serif;background:var(--paper);color:var(--ink);min-height:100dvh;display:flex;justify-content:center;letter-spacing:-.01em}
.app{width:100%;max-width:430px;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column}

header{position:relative;z-index:6;overflow:hidden}
.top{position:relative;height:214px;background:linear-gradient(180deg,#DDF0EB 0%,#EAF5F2 100%);padding:calc(env(safe-area-inset-top) + 20px) 20px 0}
.logo{display:block;height:24px;width:auto}
h1{margin-top:30px;font-size:29px;line-height:1.3;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.mascot{position:absolute;right:22px;bottom:-6px;height:152px;width:auto;z-index:2;animation:rise .7s cubic-bezier(.2,.9,.3,1.2) .15s backwards}
.star{position:absolute;width:16px;height:16px;fill:var(--green);opacity:.28}
.star.a{right:128px;top:44px}.star.b{right:30px;top:36px;width:11px;height:11px;opacity:.2}.star.c{right:112px;top:112px;width:9px;height:9px;opacity:.18}
.hill{position:relative;background:var(--green);color:#fff;padding:6px 20px 28px;border-radius:0 0 28px 28px}
.hill::before{content:"";position:absolute;left:-12%;right:-12%;top:-26px;height:52px;background:var(--green);border-radius:50% 50% 0 0}
.lead{position:relative;font-size:14px;line-height:1.55;color:#D6EEEA}
.lead b{color:#fff;font-weight:700}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

main{flex:1;padding:0 20px 32px;margin-top:28px}
.field{margin-bottom:20px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:56px;padding:0 48px 0 16px;font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--white);border:1.5px solid var(--line);border-radius:12px;transition:border-color .15s}
.sel select:focus-visible{outline:3px solid #00857C55;outline-offset:1px;border-color:var(--green)}
.sel select:disabled{background:#E9EFEE;color:#8FA09E}
.sel select.filled{border-color:var(--green)}
.sel::after{content:"";position:absolute;right:20px;top:50%;width:9px;height:9px;border-right:2px solid var(--green);border-bottom:2px solid var(--green);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel:has(select:disabled)::after{border-color:#A9B8B6}

/* 사전 동의 팝업: 헤더 아래 영역 전체를 덮음 */
.body{position:relative;flex:1;display:flex;flex-direction:column}
.layer{position:absolute;inset:-28px 0 0;z-index:5;background:rgba(242,246,245,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:48px 20px 20px;display:flex;align-items:flex-start}
.layer[hidden]{display:none}
.consent{width:100%;background:var(--white);border-radius:16px;padding:20px 18px;box-shadow:0 10px 30px rgba(22,48,46,.18)}
.consent h2{font-size:17px;font-weight:700}
.consent ul{margin:10px 0 0;padding-left:18px;font-size:14px;line-height:1.6;color:var(--sub)}
.consent li+li{margin-top:4px}
.consent-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--green);margin:0;flex:none}
.close{height:44px;padding:0 20px;border-radius:10px;background:var(--green);color:#fff;font-size:15px;font-weight:700;flex:none}
.close:disabled{background:#B9C9C7;cursor:not-allowed}
.manual{margin-top:16px;padding:16px;border-radius:12px;background:var(--white);border:1.5px solid var(--red);font-size:14px;line-height:1.6;white-space:pre-line;word-break:break-all;user-select:all;-webkit-user-select:all}

.actions{margin-top:20px}
button{font:inherit;cursor:pointer;border:0}
.go{width:100%;height:56px;border-radius:12px;background:var(--green);color:#fff;font-size:17px;font-weight:700;transition:background .15s}
.go:hover{background:var(--green-deep)}
.go:disabled{background:#B9C9C7;cursor:not-allowed}
button:focus-visible{outline:3px solid #00857C77;outline-offset:2px}
.status{display:flex;align-items:flex-start;gap:6px;margin-top:12px;font-size:14px;line-height:1.5;font-weight:600;color:var(--green);min-height:21px}
.status svg{width:16px;height:16px;flex:none;margin-top:2px}
.status.fail{color:var(--red)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop,.mascot{animation:none}*{transition:none!important}}
</style>
</head>

const MSG = `♥ 하나은행 개인형IRP 안내 ♥
안녕하세요?
세금은 줄이고, 노후는 단단하게
하나은행 개인형 IRP를 소개합니다.
-최대 가입한도 : 연 1,800만원
-최대 세액공제 : 16.5%

소득 있는 누구나 연말정산 때 세금 돌려받아요.
자세한 내용과 가입은 아래 링크에서 가능해요!

▼▼ 혜택 확인하고 신청하기
{link}

[사전에 확인해주세요]
▶ 온라인 가입시간은 09:00~18:00이고
이 외 시간 신규 가입은 예약 신규로 진행되요
▶ 개인형IRP 모바일 가입 매뉴얼 : https://url.kr/7t7d1o`;
const KEY = "hana-irp-sel";
const $ = id => document.getElementById(id);
const layer=$("layer"), agree=$("agree"), closeBtn=$("close"), main=$("main"), group=$("group"), dept=$("dept"), shareBtn=$("share"), status=$("status"), manual=$("manual");
const OK_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8" cy="8" r="7"/><path d="M4.8 8.2l2.3 2.3 4-4.4"/></svg>';
let message = "";

Object.keys(DATA).forEach(g => group.add(new Option(g, g)));

agree.addEventListener("change", () => { closeBtn.disabled = !agree.checked; });
closeBtn.addEventListener("click", () => { layer.hidden = true; main.inert = false; group.focus(); });

function fillDepts(){
  dept.length = 0;
  if(!group.value){ dept.add(new Option("먼저 그룹사를 선택하세요","")); return; }
  dept.add(new Option("부서를 선택하세요",""));
  Object.keys(DATA[group.value].depts).forEach(d => dept.add(new Option(d, d)));
}
// 소속·메시지·링크는 화면에 표시하지 않고 내부에서만 조립
function render(){
  dept.disabled = !group.value;
  group.classList.toggle("filled", !!group.value);
  dept.classList.toggle("filled", !!dept.value);
  const code = group.value && dept.value ? DATA[group.value].depts[dept.value] : "";
  message = code ? MSG.replace("{link}", BASE + code) : "";
  shareBtn.disabled = !code;
  status.textContent = ""; manual.hidden = true;
}
function setStatus(ok, text){ status.className = "status" + (ok ? "" : " fail"); status.innerHTML = (ok ? OK_ICON : "") + text; }

// 동기 복사 먼저(인앱 브라우저 대비), 안 되면 Clipboard API
function copyText(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch{}
  ta.remove();
  if(ok) return Promise.resolve(true);
  return navigator.clipboard ? navigator.clipboard.writeText(text).then(() => true, () => false) : Promise.resolve(false);
}

shareBtn.addEventListener("click", () => {
  if(!message) return;
  const text = message;
  const copied = copyText(text);
  // 공유 창은 탭 직후 바로 호출해야 막히지 않음 (await 이후 호출 금지)
  const shared = navigator.share ? navigator.share({ text }).then(() => "done", e => e.name === "AbortError" ? "cancel" : "fail") : Promise.resolve("none");
  Promise.all([copied, shared]).then(([c, sh]) => {
    if(sh === "done") setStatus(true, "공유 창을 열었어요. 메시지가 비어 있으면 붙여넣기 해 주세요.");
    else if(sh === "cancel") c ? setStatus(true, "공유를 취소했어요. 메시지는 복사되어 있어요.") : status.textContent = "";
    else if(c) setStatus(true, "메시지를 복사했어요. 메신저에 붙여넣어 보내 주세요.");
    else { // 최후 수단: 복사·공유 모두 불가한 환경에서만 메시지를 펼침
      manual.textContent = text; manual.hidden = false;
      setStatus(false, "자동 복사가 안 되는 환경이에요. 아래 메시지를 길게 눌러 복사해 보내 주세요.");
    }
  });
});

group.addEventListener("change", () => { fillDepts(); render(); save(); });
dept.addEventListener("change", () => { render(); save(); });

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ g: group.value, d: dept.value })); }catch{} }
// 지난 선택 복원 (동의 팝업은 매번 표시)
try{
  const v = JSON.parse(localStorage.getItem(KEY) || "{}");
  if(DATA[v.g]){ group.value = v.g; fillDepts(); if(DATA[v.g].depts[v.d]) dept.value = v.d; }
}catch{}
render();
</script>
